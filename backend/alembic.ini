# Run from the repo root:  alembic -c backend/alembic.ini upgrade head
# The database URL comes from .env (DATABASE_URL) via backend/app/core/config.py, never from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
